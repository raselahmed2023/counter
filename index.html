<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Button</title>

    <style>
        .c {
            justify-content: center;
            align-items: center;
            text-align: center;
            margin-top: 20%;
        }

        .click {
            border: 2px solid red;
            border-radius: 50px;
            width: 300px;
            margin: 0 auto;
            padding: 50px;
            background-color: rgb(190, 186, 186);
        }

        .n {
            font-size: 30px;
            padding: 5px;
            margin: 5px;
        }

        .btn,
        .btn0,
        .btn1 {
            padding: 10px;
            border-radius: 2px;
            font-size: 16px;
            color: brown;
            cursor: pointer;
        }

        .display{
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <!-- html code and div section -->
    <div class="c">
        <div class="click">
            <p class="n">0</p>
            <div class="display">
                <button class="btn">Click Me</button>
                 <button class="btn0">Less</button>
                <button class="btn1">Reset</button>
            </div>
        </div>
    </div>

    <!-- JS file link -->
    <script src="./script.js"></script>


</body>

</html>
